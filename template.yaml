Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RankedJobsTable
      BillingMode: PAY_PER_REQUEST   # no capacity planning, free-tier friendly
      AttributeDefinitions:
        - AttributeName: Stablekey      # company#title, collapsed
          AttributeType: S
        - AttributeName: PostedAt
          AttributeType: N
      KeySchema:
        - AttributeName: Stablekey
          KeyType: HASH
        - AttributeName: PostedAt
          KeyType: RANGE