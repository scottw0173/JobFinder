AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  JobFinderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60
      CodeUri: .
      Handler: bootstrap          # provided.al2023 expects a binary named bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]      
      Timeout: 900                # scoring loop is slow; max is 900s
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:           # table read + write + the delete sweep
            TableName: !Ref JobsTable
        - S3CrudPolicy:                 # logs bucket writes
            BucketName: jobfinder-log-bucket
        - S3ReadPolicy:                 # pre-existing config bucket
            BucketName: jobfinder-config-files
        - Statement:                    # SSM SecureString read
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: arn:aws:ssm:us-east-2:834424013123:parameter/GEMINIAPIKEY
      Environment:
        Variables:
          DYNAMOTABLE: !Ref JobsTable
          S3LOGS: jobfinder-log-bucket
          S3CONFIG: jobfinder-config-files
          S3REGION: !Ref AWS::Region
          GEMINIAPIKEY: arn:aws:ssm:us-east-2:834424013123:parameter/GEMINIAPIKEY
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 * * ? *)
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RankedJobsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stablekey
          AttributeType: S
        - AttributeName: posted_at
          AttributeType: N
      KeySchema:
        - AttributeName: stablekey
          KeyType: HASH
        - AttributeName: posted_at
          KeyType: RANGE