AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  JobFinderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 60
      CodeUri: .
      Handler: bootstrap          # provided.al2023 expects a binary named bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]      
      Timeout: 900                # scoring loop is slow; max is 900s
      MemorySize: 512
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:BatchWriteItem
              - dynamodb:UpdateItem
            Resource: !GetAtt JobsTable.Arn
        - Statement:                # logs bucket writes
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: arn:aws:s3:::jobfinder-log-bucket/*
        - Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
            Resource: arn:aws:s3:::jobfinder-config-files/*
        - Statement:
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: 
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/GEMINIAPIKEY"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/GCP-Project-Key"
      Environment:
        Variables:
          DYNAMOTABLE: !Ref JobsTable
          S3LOGS: jobfinder-log-bucket
          S3CONFIG: jobfinder-config-files
          S3REGION: !Ref AWS::Region
          GEMINIMODEL: gemini-3.1-flash-lite
          SPREADSHEETID: 1qaKoa8gpc9ggyCI3mmIBxoN2CWwgwKLvxrItZvMBQoA
          GEMINIAPIKEY: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/GEMINIAPIKEY"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 * * ? *)
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RankedJobsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stablekey
          AttributeType: S
        - AttributeName: posted_at
          AttributeType: N
      KeySchema:
        - AttributeName: stablekey
          KeyType: HASH
        - AttributeName: posted_at
          KeyType: RANGE